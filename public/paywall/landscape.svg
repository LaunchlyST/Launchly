<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f6fa8"/>
      <stop offset="0.30" stop-color="#c2789c"/>
      <stop offset="0.52" stop-color="#f09a6a"/>
      <stop offset="0.68" stop-color="#f9c073"/>
      <stop offset="0.80" stop-color="#ffe3a8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffe08a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b184"/>
      <stop offset="0.10" stop-color="#c98f8f"/>
      <stop offset="0.34" stop-color="#6f93b6"/>
      <stop offset="0.70" stop-color="#3e6c94"/>
      <stop offset="1" stop-color="#26496e"/>
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <linearGradient id="sunPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeab4" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cliffL" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3f6046"/><stop offset="1" stop-color="#20362b"/>
    </linearGradient>
    <linearGradient id="cliffR" x1="1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#446a4d"/><stop offset="1" stop-color="#22392c"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="2400" height="840" fill="url(#sky)"/>

  <!-- sun, low over the water -->
  <circle cx="560" cy="700" r="360" fill="url(#sunGlow)"/>
  <circle cx="560" cy="716" r="104" fill="#fff8dc"/>

  <!-- high cloud banks, warm on the left, cool and heavy upper right -->
  <g opacity="0.85">
    <path d="M-40 150 q110 -78 250 -40 q90 -70 210 -22 q140 -34 210 44 q120 -8 150 60 q-130 62 -400 54 q-260 -8 -420 -96 z" fill="#ffd2b0" opacity="0.9"/>
    <path d="M120 300 q130 -60 268 -18 q120 -40 236 24 q-110 76 -318 66 q-150 -8 -186 -72 z" fill="#f8b9a6" opacity="0.85"/>
    <path d="M-60 470 q180 -66 356 -14 q-96 62 -244 62 q-84 0 -112 -48 z" fill="#f4a58f" opacity="0.7"/>
  </g>
  <g opacity="0.9">
    <path d="M1180 96 q150 -74 300 -18 q120 -66 268 -8 q170 -40 268 60 q120 -6 156 76 q-150 92 -540 84 q-372 -8 -452 -114 z" fill="#8f83b8"/>
    <path d="M1320 40 q170 -60 330 -6 q140 -34 250 34 q-160 66 -430 60 q-190 -6 -250 -70 z" fill="#6f6699" opacity="0.85"/>
    <path d="M1420 250 q190 -70 400 -10 q150 -30 260 40 q-190 84 -470 74 q-190 -8 -240 -74 z" fill="#a98ab4" opacity="0.8"/>
    <path d="M1620 400 q200 -62 400 -6 q-140 70 -330 62 q-110 -4 -140 -46 z" fill="#e0a3a0" opacity="0.7"/>
  </g>
  <g opacity="0.6">
    <path d="M700 220 q140 -52 268 -8 q-100 56 -232 48 q-70 -6 -76 -32 z" fill="#ffe0c2"/>
    <path d="M880 420 q160 -54 300 -6 q-120 62 -260 50 q-72 -8 -76 -38 z" fill="#ffcfae"/>
  </g>

  <!-- water -->
  <rect y="840" width="2400" height="510" fill="url(#water)"/>
  <!-- the sun's path across the water -->
  <path d="M470 840 L650 840 L820 1350 L300 1350 Z" fill="url(#sunPath)" opacity="0.6" filter="url(#soften)"/>
  <!-- glitter -->
  <g fill="#fff2cd" opacity="0.42" filter="url(#soften)">
    <rect x="500" y="866" width="130" height="5" rx="2.5"/>
    <rect x="470" y="898" width="190" height="6" rx="3"/>
    <rect x="520" y="936" width="110" height="5" rx="2.5"/>
    <rect x="430" y="982" width="250" height="7" rx="3.5"/>
    <rect x="500" y="1042" width="180" height="6" rx="3"/>
    <rect x="400" y="1108" width="300" height="8" rx="4"/>
    <rect x="470" y="1196" width="230" height="7" rx="3.5"/>
  </g>
  <g fill="#ffffff" opacity="0.16">
    <rect x="1200" y="900" width="320" height="4" rx="2"/>
    <rect x="1500" y="960" width="420" height="5" rx="2.5"/>
    <rect x="900" y="1030" width="360" height="5" rx="2.5"/>
    <rect x="1600" y="1120" width="500" height="6" rx="3"/>
    <rect x="1000" y="1230" width="420" height="6" rx="3"/>
  </g>

  <!-- far headland on the horizon -->
  <path d="M1180 840 q120 -66 250 -50 q140 18 210 50 z" fill="#5c6f88" opacity="0.55"/>
  <path d="M1700 840 q150 -54 300 -30 q100 16 170 30 z" fill="#55698a" opacity="0.45"/>

  <!-- left cliff, with pines and two cottages -->
  <path d="M0 560 L150 470 L300 560 L420 520 L520 700 L560 840 L0 840 Z" fill="url(#cliffL)"/>
  <g fill="#1c3226">
    <path d="M70 470 l46 96 l-92 0 z"/><path d="M70 420 l38 80 l-76 0 z"/>
    <path d="M180 500 l42 90 l-84 0 z"/><path d="M180 456 l34 74 l-68 0 z"/>
    <path d="M300 540 l40 84 l-80 0 z"/><path d="M300 500 l32 70 l-64 0 z"/>
    <path d="M400 590 l36 78 l-72 0 z"/>
    <circle cx="120" cy="640" r="46"/><circle cx="240" cy="690" r="40"/><circle cx="30" cy="700" r="44"/>
  </g>
  <g>
    <rect x="236" y="600" width="70" height="52" fill="#f7f1e4"/>
    <path d="M228 600 L271 566 L314 600 Z" fill="#b5514a"/>
    <rect x="318" y="622" width="52" height="40" fill="#f7f1e4"/>
    <path d="M311 622 L344 596 L377 622 Z" fill="#b5514a"/>
  </g>

  <!-- right headland, taller, with its own trees and a cottage -->
  <path d="M2400 500 L2230 420 L2060 540 L1940 500 L1880 700 L1860 840 L2400 840 Z" fill="url(#cliffR)"/>
  <g fill="#1e3628">
    <path d="M2300 430 l44 92 l-88 0 z"/><path d="M2300 386 l36 78 l-72 0 z"/>
    <path d="M2180 500 l40 86 l-80 0 z"/><path d="M2180 458 l32 72 l-64 0 z"/>
    <path d="M2060 570 l38 82 l-76 0 z"/>
    <circle cx="2360" cy="620" r="48"/><circle cx="2240" cy="670" r="42"/><circle cx="2120" cy="700" r="40"/>
  </g>
  <g>
    <rect x="1980" y="640" width="62" height="46" fill="#f7f1e4"/>
    <path d="M1972 640 L2011 610 L2050 640 Z" fill="#b5514a"/>
  </g>

  <!-- islands in the bay -->
  <g>
    <path d="M1140 900 q70 -46 150 -14 q60 24 84 14 q-50 34 -160 34 q-60 0 -74 -34 z" fill="#33513c"/>
    <path d="M1180 884 q26 -34 52 -6 q-24 12 -52 6 z" fill="#27412f"/>
    <path d="M1560 1020 q96 -58 210 -18 q80 28 110 18 q-70 44 -216 44 q-84 0 -104 -44 z" fill="#2e4b39"/>
    <path d="M1620 1000 q34 -40 66 -8 q-30 14 -66 8 z" fill="#233c2c"/>
    <path d="M760 940 q54 -32 116 -10 q42 16 62 10 q-38 26 -120 26 q-46 0 -58 -26 z" fill="#35533e" opacity="0.9"/>
  </g>
</svg>
