name = "launchly-subscription-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
FRONTEND_URL = "https://launchly.pazeruga.workers.dev"

# Set these via `wrangler secret put`
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# KALODATA_API_KEY  — server-side only. Real upstream creator-data provider
#   for the Search Creator API. Set with: wrangler secret put KALODATA_API_KEY
#   Never put this in a [vars] entry, VITE_ variable, or the frontend.

# Optional — only needed if Kalodata's API is not at the default
# https://api.kalodata.com (see worker/src/kalodataClient.ts).
# wrangler var put KALODATA_API_BASE_URL=https://...
# KALODATA_API_BASE_URL

# Set via `wrangler var put STRIPE_PRICE_ID=price_xxx`
# STRIPE_PRICE_ID  — the main Launchly app subscription (£5/mo), already in use.

# Set via `wrangler var put CREATOR_API_PRICE_ID=price_xxx`
# CREATOR_API_PRICE_ID  — the separate "Launchly Search Creator API" £5/mo
# price. Create this Price in Stripe (see subscription-backend/README.md),
# then set it here. Required for POST /api/creator-api-subscription/checkout.

# Optional — enables real per-key rate limiting on the public
# GET /api/v1/creators/search endpoint (60 req/min/key). Without it the
# endpoint still works, it just skips the rate-limit check.
# Create with: wrangler kv:namespace create API_RATE_LIMIT
# then uncomment and fill in the id below:
# [[kv_namespaces]]
# binding = "API_RATE_LIMIT"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
