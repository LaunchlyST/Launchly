name: Deploy

# Builds the SPA and publishes it to the "launchly" Cloudflare Worker
# (see wrangler.jsonc — assets are served from ./dist).
#
# Requires two repository secrets before it can run:
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account the worker lives in
#
# And these build-time values, as repository variables or secrets. VITE_WORKER_URL
# is not optional: without it the built bundle has no subscription API base URL,
# so the paywall cannot read entitlements or open checkout.
#   VITE_WORKER_URL        the subscription worker's URL (NOT this site's origin)
#   VITE_SUPABASE_URL      Supabase project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY  Supabase publishable (anon) key
# Optional:
#   VITE_PAYWALL_IMAGE / VITE_PAYWALL_HORIZON / VITE_PAYWALL_FOLIAGE
#   VITE_FEEDBACK_EMAIL / VITE_BUG_URL / VITE_CHANGELOG_URL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Wrangler 4 refuses to start on anything older, and
          # @supabase/supabase-js also declares engines.node >=22.0.0.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYWALL_IMAGE: ${{ vars.VITE_PAYWALL_IMAGE }}
          VITE_PAYWALL_HORIZON: ${{ vars.VITE_PAYWALL_HORIZON }}
          VITE_PAYWALL_FOLIAGE: ${{ vars.VITE_PAYWALL_FOLIAGE }}
          VITE_FEEDBACK_EMAIL: ${{ vars.VITE_FEEDBACK_EMAIL }}
          VITE_BUG_URL: ${{ vars.VITE_BUG_URL }}
          VITE_CHANGELOG_URL: ${{ vars.VITE_CHANGELOG_URL }}

      # Fails fast with an unambiguous message (never the secret value
      # itself) instead of leaving it to Wrangler's own generic
      # "set a CLOUDFLARE_API_TOKEN environment variable" error further down
      # the log, which reads the same whether the secret is unset or just
      # didn't save in the GitHub UI.
      - name: Check Cloudflare credentials are present
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them at Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      # Temporary: cloudflare/wrangler-action@v3 was only ever reporting
      # "npx failed with exit code 1" with no further output, even with
      # quiet: false. Running the same commands directly as shell steps
      # surfaces Wrangler's real stdout/stderr so the actual failure (not
      # just the action's summary of it) is visible in the log. Runs from
      # the repo root — that's where wrangler.jsonc (the root "launchly"
      # SPA Worker) lives; ./dist was just built by the previous step.
      - name: Wrangler version
        run: npx wrangler@4.129.0 --version

      # Diagnoses "Headers.set: ... is an invalid header value" without ever
      # printing the token — reports only its length and whether it contains
      # characters an HTTP header can't hold (newline, CR, leading/trailing
      # whitespace, or anything outside the token charset Cloudflare issues:
      # letters, digits, underscore, hyphen).
      - name: Inspect CLOUDFLARE_API_TOKEN shape (no value printed)
        run: |
          token="$CLOUDFLARE_API_TOKEN"
          echo "Length: ${#token}"
          case "$token" in
            *$'\n'*) echo "::error::Token contains a newline character" ;;
          esac
          case "$token" in
            *$'\r'*) echo "::error::Token contains a carriage-return character" ;;
          esac
          case "$token" in
            " "*) echo "::error::Token has a leading space" ;;
          esac
          case "$token" in
            *" ") echo "::error::Token has a trailing space" ;;
          esac
          if [[ "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Charset OK (letters, digits, underscore, hyphen only)."
          else
            echo "::error::Token contains a character outside [A-Za-z0-9_-] — Cloudflare tokens never do. It likely has extra pasted text or a quote character."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
